apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: platform-app-default-deny
  namespace: app
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: platform-app-allow
  namespace: app
spec:
  podSelector:
    matchLabels:
      app: platform-app
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability   # allow Prometheus to scrape /metrics
      ports:
        - port: 8080
          protocol: TCP
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to: []   # RDS lives outside the cluster; scope further with an IP block per environment overlay
      ports:
        - port: 5432
          protocol: TCP
