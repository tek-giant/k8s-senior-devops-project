# Update the dev deployment after CI successfully publishes an image.
name: CD - promote to dev

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: promote-dev
  cancel-in-progress: false

jobs:
  bump-dev-image:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest

    env:
      CI_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Install kustomize
        run: |
          curl -fsSL \
            https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh \
            -o install-kustomize.sh
          bash install-kustomize.sh

      - name: Bump image tag in dev overlay
        working-directory: kubernetes/overlays/dev
        run: |
          ../../../kustomize edit set image \
            "ACCOUNT_ID.dkr.ecr.eu-west-2.amazonaws.com/platform-app=743978812281.dkr.ecr.us-east-1.amazonaws.com/platform-app:${CI_SHA:0:7}"

      - name: Commit and push
        run: |
          git config user.name "gitops-bot"
          git config user.email "gitops-bot@example.com"

          git add kubernetes/overlays/dev/kustomization.yaml

          if git diff --cached --quiet; then
            echo "Image tag is already up to date."
            exit 0
          fi

          git commit -m "chore(dev): deploy ${CI_SHA:0:7}"
          git pull --rebase origin main
          git push origin HEAD:main