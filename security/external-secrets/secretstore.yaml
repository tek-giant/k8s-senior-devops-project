# ClusterSecretStore: points External Secrets Operator at AWS Secrets Manager,
# authenticating via the app's IRSA role (no static AWS credentials in-cluster).
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-west-2
      auth:
        jwt:
          serviceAccountRef:
            name: app-sa
            namespace: app
