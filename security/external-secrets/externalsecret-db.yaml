# ExternalSecret: pulls the DB credentials Terraform wrote to Secrets Manager
# (terraform/modules/rds) into a native K8s Secret, refreshed every hour.
# This Secret is what the app's envFrom references - it never appears in git.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: app-db-credentials
  namespace: app
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: app-db-credentials
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: platform-dev/app/db-credentials   # change per environment overlay
