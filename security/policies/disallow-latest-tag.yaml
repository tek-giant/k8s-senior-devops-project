apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-image-tag
      match:
        any:
          - resources: { kinds: [Pod] }
      validate:
        message: "Image tags 'latest' or missing are not allowed - every deploy must be traceable to a git SHA."
        pattern:
          spec:
            containers:
              - image: "!*:latest"
